version: 2

models:

  - name: stg_customers
    description: Cleaned and standardized customer data from the raw customers source.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: email
        description: Customer email address standardized to lowercase.

      - name: state
        description: Two-letter standardized state code where known.


  - name: stg_products
    description: Cleaned product master data.
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: unit_price
        data_tests:
          - not_null


  - name: stg_orders
    description: Cleaned order-level data.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['COMPLETED', 'CANCELLED']


  - name: stg_order_items
    description: Cleaned order line-item data.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: quantity
        data_tests:
          - not_null


  - name: stg_payments
    description: Cleaned payment transaction data.
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['PAID', 'REFUNDED']